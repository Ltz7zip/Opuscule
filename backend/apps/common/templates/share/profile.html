{% extends "share/base.html" %}
{% block content %}
  <span class="eyebrow">个人主页</span>
  <h1>{{ profile.name }}</h1>
  <p class="lead">{{ profile.headline|default:"Opuscule 作者" }}</p>
  {% if profile.bio %}<p>{{ profile.bio|linebreaks }}</p>{% endif %}
  <a class="cta" href="{{ canonical_url }}">在 Opuscule 打开 →</a>
  <div class="meta">@{{ profile.user.username }}</div>
{% endblock %}
