<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0a0a'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23a1a1aa'/%3E%3C/svg%3E">
  <title>{{ meta_title }}</title>
  <meta name="description" content="{{ meta_description }}">
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="{{ canonical_url }}">
  <link rel="alternate" type="application/rss+xml" title="Opuscule 公开 Wiki" href="/feed.xml">
  {% block feed %}{% endblock %}
  <meta property="og:title" content="{{ meta_title }}">
  <meta property="og:description" content="{{ meta_description }}">
  <meta property="og:type" content="{% block og_type %}website{% endblock %}">
  <meta property="og:url" content="{{ canonical_url }}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ meta_title }}">
  <meta name="twitter:description" content="{{ meta_description }}">
  <style>
    :root { color-scheme: dark; --bg:#0a0a0a; --card:#141414; --line:#27272a; --fg:#f4f4f5; --muted:#a1a1aa; --accent:#e4e4e7; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif; line-height:1.65; }
    a { color:inherit; }
    .wrap { width:min(760px,100%); margin:0 auto; padding:28px 20px 56px; }
    .top { display:flex; align-items:center; justify-content:space-between; gap:12px; padding-bottom:22px; border-bottom:1px solid var(--line); }
    .brand { display:inline-flex; align-items:center; gap:8px; text-decoration:none; font-weight:700; letter-spacing:-.02em; }
    .mark { width:24px; height:24px; display:grid; place-items:center; border:1px solid #3f3f46; border-radius:7px; color:var(--muted); }
    .top a.open { color:var(--muted); font-size:12px; text-decoration:none; }
    .top a.open:hover { color:var(--fg); }
    main { padding-top:38px; }
    .eyebrow { color:var(--muted); font-size:10px; letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:10px 0 12px; font-size:clamp(34px,7vw,56px); line-height:1.06; letter-spacing:-.045em; }
    h2 { margin:4px 0 8px; font-size:18px; letter-spacing:-.02em; }
    p { margin:0 0 14px; color:var(--muted); font-size:14px; }
    .lead { max-width:58ch; font-size:15px; }
    .card { border:1px solid var(--line); border-radius:12px; background:var(--card); padding:20px; margin-top:22px; }
    .body-text { color:#d4d4d8; font-size:15px; }
    .body-text p { color:#d4d4d8; margin:0 0 12px; }
    .meta { margin-top:18px; color:#71717a; font-family:ui-monospace,SFMono-Regular,monospace; font-size:10px; }
    .cta { display:inline-flex; align-items:center; gap:6px; margin-top:20px; border:1px solid #3f3f46; border-radius:8px; padding:9px 13px; font-size:12px; text-decoration:none; }
    .cta:hover { background:#1f1f23; }
    .list { display:flex; flex-direction:column; border-top:1px solid var(--line); margin-top:22px; }
    .list a { display:block; padding:13px 2px; border-bottom:1px solid var(--line); text-decoration:none; }
    .list a:hover h2 { text-decoration:underline; text-underline-offset:3px; }
    .list p { margin:0; font-size:12px; }
    footer { margin-top:36px; color:#52525b; font-size:10px; }
    @media (max-width:520px) { .wrap { padding:20px 14px 40px; } .card { padding:16px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="/"><span class="mark">○</span> Opuscule</a>
      <a class="open" href="{{ canonical_url }}">在 Opuscule 打开 →</a>
    </header>
    <main>
      {% block content %}{% endblock %}
      <footer>Opuscule · 私人世界的公开 Wiki · 分享页不加载编辑器</footer>
    </main>
  </div>
</body>
</html>
