{% load static %}<!DOCTYPE html>
<html lang="zh-CN" data-theme="{{ theme_mode }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>关系树 · 世界观共建</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2318181b'/%3E%3Cg fill='none' stroke='%23fafafa' stroke-width='2'%3E%3Crect x='12' y='5' width='8' height='7' rx='1.6'/%3E%3Crect x='3.5' y='20' width='8' height='7' rx='1.6'/%3E%3Crect x='20.5' y='20' width='8' height='7' rx='1.6'/%3E%3Cpath d='M16 12v4M7.5 20v-4h17v4'/%3E%3C/g%3E%3C/svg%3E" />
  <!-- Minimal 设计语言（桌面 Minimalist 设计系统的 token：灰阶主色 / 12-16px 圆角 / 4px 栅格 / 扁平） -->
  <link rel="stylesheet" href="{% static 'minimal.css' %}?v={{ static_version }}" />
  <link rel="stylesheet" href="{% static 'relationship.css' %}?v={{ static_version }}" />
</head>
<body class="rt-body{% if embed %} is-embed{% endif %}{% if paper %} is-paper{% endif %}">
  <div class="rt-app" id="rtApp"
       data-doc="{{ doc_id }}"
       data-doc-missing="{{ doc_missing|yesno:'1,0' }}"
       data-embed="{{ embed|yesno:'1,0' }}"
       data-readonly="{{ readonly|yesno:'1,0' }}"
       data-templates-url="/api/world/relationship/templates"
       data-trees-url="/api/world/relationship/trees">

    <!-- ================= 第一步：选模版（图1） ================= -->
    <section class="rt-screen rt-screen--picker" data-screen="picker">
      <aside class="rt-side">
        <header class="rt-side-head">
          <span class="rt-side-glyph" data-icon="network" data-icon-size="19" aria-hidden="true"></span>
          <div>
            <h1>关系树</h1>
            <p>选择您要构建的树的类型</p>
          </div>
        </header>
        <div class="rt-template-list" id="rtTemplateList" role="listbox" aria-label="关系树模版"></div>
        <div class="rt-side-foot">
          <h2 class="rt-existing-head">已有关系树</h2>
          <div class="rt-existing" id="rtExisting"></div>
        </div>
      </aside>

      <div class="rt-stage">
        <div class="rt-stage-canvas" id="rtPickerCanvas" data-grid-canvas></div>
        <div class="rt-stage-foot">
          <button type="button" class="rt-btn rt-btn--primary" id="rtContinue">继续</button>
        </div>
      </div>
    </section>

    <!-- ================= 第二步：模版关系（图2/图3） ================= -->
    <section class="rt-screen rt-screen--template" data-screen="template" hidden>
      <aside class="rt-side">
        <header class="rt-side-head rt-side-head--back">
          <button type="button" class="rt-back" id="rtBack" title="返回模版列表" aria-label="返回">
            <span data-icon="chevron-left" data-icon-size="18"></span>
          </button>
          <div>
            <h1 id="rtSideTitle">关系树</h1>
            <p id="rtTemplateCaption">家庭 关系</p>
          </div>
        </header>

        <div class="rt-relation-list" id="rtRelationList"></div>

        <button type="button" class="rt-add-relation" id="rtAddRelation">
          <span data-icon="plus" data-icon-size="17" aria-hidden="true"></span> 添加关系
        </button>
      </aside>

      <div class="rt-stage">
        <div class="rt-stage-canvas" id="rtTemplateCanvas" data-grid-canvas></div>
        <div class="rt-stage-foot">
          <label class="rt-check">
            <input type="checkbox" id="rtWithDemo" checked />
            同时放入示例人物
          </label>
          <button type="button" class="rt-btn rt-btn--primary" id="rtCreate">创建关系树</button>
        </div>
      </div>
    </section>

    <!-- ================= 第三步：编辑区（图4-图7） ================= -->
    <section class="rt-screen rt-screen--editor" data-screen="editor" hidden>
      <header class="rt-topbar">
        <a class="rt-topbar-back" href="/relationship" title="回到模版选择">
          <span data-icon="chevron-left" data-icon-size="18"></span>
        </a>
        <div class="rt-topbar-title">
          <strong id="rtDocName">关系树</strong>
          <span class="rt-chip" id="rtKindChip">家庭</span>
        </div>
        <div class="rt-topbar-tools">
          <button type="button" class="rt-tool rt-write" data-action="add-person" title="添加人物">
            <span data-icon="user-plus" data-icon-size="15"></span> 添加人物
          </button>
          <button type="button" class="rt-tool rt-write" data-action="add-note" title="添加备注">
            <span data-icon="sticky-note" data-icon-size="15"></span> 添加备注
          </button>
          <span class="rt-tool-sep" aria-hidden="true"></span>
          <button type="button" class="rt-tool rt-write" data-action="relations" title="可用关系">关系清单</button>
          <button type="button" class="rt-tool rt-tool--ghost" data-action="fit" title="缩放到适应">适应</button>
          <a class="rt-tool rt-embed-only" id="rtOpenFull" target="_blank" rel="noopener"
             title="在新标签页里全屏编辑" aria-label="在新标签页里全屏编辑">
            <span data-icon="external-link" data-icon-size="15"></span>
          </a>
          <span class="rt-save" id="rtSaveState">已保存</span>
        </div>
      </header>

      <div class="rt-canvas-wrap" id="rtCanvasWrap">
        <div class="rt-grid" id="rtGrid" data-grid-canvas>
          <svg class="rt-edges" id="rtEdges" aria-hidden="true"></svg>
          <div class="rt-nodes" id="rtNodes"></div>
          <svg class="rt-edges rt-edges--live" id="rtLive" aria-hidden="true"></svg>
        </div>

        <div class="rt-zoom">
          <button type="button" data-action="zoom-in" title="放大" aria-label="放大">
            <span data-icon="zoom-in" data-icon-size="16"></span>
          </button>
          <button type="button" data-action="zoom-out" title="缩小" aria-label="缩小">
            <span data-icon="zoom-out" data-icon-size="16"></span>
          </button>
          <button type="button" data-action="fit" title="缩放到适应" aria-label="缩放到适应">
            <span data-icon="maximize" data-icon-size="16"></span>
          </button>
        </div>

        <p class="rt-empty-hint" id="rtEmptyHint">
          在空白处 <b>右键</b> 就能添加人物
        </p>
      </div>
    </section>

    <!-- ================ 打不开：文档不在（被删 / 进了回收站） ================ -->
    <section class="rt-screen rt-screen--error" data-screen="error" hidden>
      <div class="rt-error">
        <span class="rt-error-glyph" data-icon="triangle-alert" data-icon-size="26" aria-hidden="true"></span>
        <h2>打不开这棵关系树</h2>
        <p id="rtErrorText">它可能已经被删掉了。</p>
        <div class="rt-error-actions">
          <button type="button" class="rt-btn" id="rtErrorRetry">重试</button>
          <a class="rt-btn rt-btn--primary rt-error-home" href="/relationship">回到模版选择</a>
        </div>
      </div>
    </section>

    <!-- 右键菜单（图5） -->
    <div class="rt-menu" id="rtContextMenu" hidden role="menu">
      <button type="button" data-menu="person" role="menuitem">
        <span data-icon="user-plus" data-icon-size="16"></span>
        在此添加人物
      </button>
      <button type="button" data-menu="note" role="menuitem">
        <span data-icon="sticky-note" data-icon-size="16"></span>
        在此处添加备注
      </button>
    </div>

    <!-- 关系类型菜单（图6） -->
    <div class="rt-relations-pop" id="rtRelationsPop" hidden role="dialog" aria-label="关系">
      <p class="rt-pop-title">关系</p>
      <div class="rt-pop-grid" id="rtPopGrid"></div>
      <button type="button" class="rt-pop-add" data-pop="custom">
        <span data-icon="plus" data-icon-size="16"></span> 创建自定义
      </button>
      <div class="rt-pop-sep" aria-hidden="true"></div>
      <button type="button" class="rt-pop-row" data-pop="link">
        <span data-icon="link" data-icon-size="16"></span>
        链接现有人员…
      </button>
      <button type="button" class="rt-pop-row" data-pop="skip">暂时跳过</button>
    </div>

    <!-- 卡片被选中时浮出来的小工具条（图6 顶部） -->
    <div class="rt-card-tools" id="rtCardTools" hidden role="toolbar">
      <button type="button" data-card-tool="card">
        <span data-icon="user-plus" data-icon-size="15"></span> 创建卡片
      </button>
      <button type="button" data-card-tool="assign">
        <span data-icon="link" data-icon-size="15"></span> 分配卡片
      </button>
      <button type="button" data-card-tool="image" title="设置头像" aria-label="设置头像">
        <span data-icon="image" data-icon-size="15"></span>
      </button>
      <span class="rt-tool-sep" aria-hidden="true"></span>
      <button type="button" data-card-tool="deceased" title="标记已故" aria-label="标记已故">
        <span data-icon="skull" data-icon-size="15"></span>
      </button>
      <button type="button" data-card-tool="favourite" title="标记重点" aria-label="标记重点">
        <span data-icon="star" data-icon-size="15"></span>
      </button>
      <button type="button" data-card-tool="delete" class="is-danger" title="删除" aria-label="删除">
        <span data-icon="trash-2" data-icon-size="15"></span>
      </button>
    </div>

    <div class="rt-toast" id="rtToast" hidden></div>
  </div>

  <script src="{% static 'icons.js' %}?v={{ static_version }}"></script>
  <script src="{% static 'relationship.js' %}?v={{ static_version }}"></script>
</body>
</html>
