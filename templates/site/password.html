{% load static %}<!DOCTYPE html>
<html lang="zh-CN" data-theme="{{ theme_mode|default:'dark' }}">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <title>{{ world.name }} · 需要密码</title>
  <link rel="stylesheet" href="{% static 'site.css' %}?v={{ static_version }}" />
  <link rel="stylesheet" href="{% static 'apple.css' %}?v={{ static_version }}" />
  <!-- 现代终端设计语言（DESIGN.md）—— 外观权威：把前几层的语义 token 重映射到终端取值 -->
  <link rel="stylesheet" href="{% static 'terminal.css' %}?v={{ static_version }}" />
  <link rel="stylesheet" href="{% static 'polish.css' %}?v={{ static_version }}" />
  <!-- Opuscule 设计语言层（默认深色皮肤）：只重映射变量，必须最后加载；删掉即回滚 -->
  <link rel="stylesheet" href="{% static 'opuscule.css' %}?v={{ static_version }}" />
</head>
<body class="site" style="--site-primary: {{ theme.primaryColor }};">
  <main class="gate">
    <h1>{{ world.name }}</h1>
    <p>这个世界是{{ audience_label }}的，输入密码后继续。</p>
    {% if error %}<p class="gate-error">密码不对，再试一次。</p>{% endif %}
    <form method="post" action="{% url 'site:unlock' world.published_slug %}">
      {% csrf_token %}
      <input type="password" name="password" placeholder="访问密码" autofocus />
      <button type="submit">进入</button>
    </form>
  </main>
</body>
</html>
