{% load static %}<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <title>{{ world.name }} · 需要密码</title>
  <link rel="stylesheet" href="{% static 'site.css' %}" />
</head>
<body style="--site-primary: {{ theme.primaryColor }};">
  <main class="gate">
    <h1>{{ world.name }}</h1>
    <p>这个世界是{{ audience_label }}的，输入密码后继续。</p>
    {% if error %}<p class="gate-error">密码不对，再试一次。</p>{% endif %}
    <form method="post" action="{% url 'site:unlock' world.published_slug %}">
      {% csrf_token %}
      <input type="password" name="password" placeholder="访问密码" autofocus />
      <button type="submit">进入</button>
    </form>
  </main>
</body>
</html>
