# Opuscule: static SPA from frontend/dist, Django under /api, /admin, /media.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __SERVER_NAME__;

    root /srv/opuscule/frontend/dist;
    index index.html;

    client_max_body_size 21m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Django owns these paths.
    location ~ ^/(api|admin|share|robots\.txt|sitemap\.xml|healthz)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ~ ^/(media|static)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Hashed assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback; SSR pages fall back to the client bundle.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
