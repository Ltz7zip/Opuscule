# Shared location rules for both the plain and the TLS server block.
location ~ ^/(api|admin|share|robots\.txt|sitemap\.xml|healthz)(/|$) {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

# Django does not serve user files under gunicorn: hand them to nginx.
location /media/ {
    alias /srv/opuscule/backend/media/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
}

location /static/ {
    alias /srv/opuscule/backend/staticfiles/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
}

location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location / {
    try_files $uri $uri/ /index.html;
}
