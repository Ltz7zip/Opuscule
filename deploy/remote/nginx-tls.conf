# HTTPS site reusing an existing certificate.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __SERVER_NAME__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __SERVER_NAME__;

    ssl_certificate     __CERT__fullchain.pem;
    ssl_certificate_key __CERT__privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /srv/opuscule/frontend/dist;
    index index.html;

    client_max_body_size 21m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /srv/opuscule/deploy/remote/locations.conf;
}
