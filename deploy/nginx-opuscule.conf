# Nginx 反向代理（腾讯云轻量·中国香港 / 阿里云香港等免备案场景同样适用）。
#
# 部署位置（Debian/Ubuntu 惯例；RHEL 系或习惯 conf.d 的放 /etc/nginx/conf.d/opuscule.conf 亦可）：
#   sudo cp deploy/nginx-opuscule.conf /etc/nginx/sites-available/opuscule
#   sudo ln -sf /etc/nginx/sites-available/opuscule /etc/nginx/sites-enabled/opuscule
#   sudo sed -i 's/example.com/你的域名/g' /etc/nginx/sites-available/opuscule
#   sudo nginx -t && sudo systemctl reload nginx
#
# ── 首次上线的正确顺序（别跳步，跳了 nginx 会起不来）────────────────────────
# 下面这份是**最终形态**：80 段只做跳转，服务跑在 443 段。它引用的证书文件必须先
# 存在，否则 `nginx -t` 报 "cannot load certificate"、nginx 停摆；而 nginx 停着
# `certbot --nginx` 也跑不了，会卡成死循环。所以分三步：
#
#   ① 先只上 80 段：把 443 段整段注释掉，并把 80 段的 `location /` 换成下方
#      「阶段一」注释里的写法，确认 http://你的域名 能打开；
#   ② 签证书（HTTP-01 走 80，不需要 443 先开）：
#        sudo certbot certonly --nginx -d 你的域名
#      证书落在 /etc/letsencrypt/live/你的域名/，certbot 同时注册好自动续期；
#      它会顺手生成 options-ssl-nginx.conf 与 ssl-dhparams.pem，TLS 参数不用手写；
#   ③ 恢复成这份最终形态（取消 443 段注释、80 段改回跳转），然后**重启**：
#        sudo nginx -t && sudo systemctl restart nginx
#      这里动的是 listen 指令，必须 restart 而不是 reload。
#
# 80 段为什么要留 /.well-known/acme-challenge/ 且不能跟着跳走：certbot 每 60 天
# 自动续期一次，校验走的就是 80 端口这个路径；整段 301 会把校验请求一起跳走，
# 续期就废了，证书到期站点直接红。
#
# 分工：/static/ 由 Nginx 直发磁盘；/media/ 必须经 Django 鉴权（按「所属文档是否公开」
# 放行），所以**不能**用 alias 直发，否则知道路径就能下载未公开的图——让它落到下面
# location / 转发给 Gunicorn（见 apps.world.views.media_file）。
# /sw.js 由 Django 提供（自带 Service-Worker-Allowed 头），无需特殊配置。
#
# 关于 HSTS：DEBUG=0 时 Django 会给响应加
#   Strict-Transport-Security: max-age=31536000; includeSubDomains; preload
# 浏览器记下之后就再也不走 http 了。所以务必确认 HTTPS 稳定、且证书自动续期
# 真的能跑通（`sudo certbot renew --dry-run`）之后再对外。

# ═══════════ 阶段一（首次上线临时用，验证完换回最终形态）═══════════
# 用法：注释掉下面的 443 段，并用这一段替换正式的 80 段。
#
# server {
#     listen 80;
#     server_name example.com www.example.com;
#     client_max_body_size 30m;
#     location /static/ { alias /srv/opuscule/staticfiles/; access_log off; expires 7d; }
#     location / {
#         proxy_pass http://127.0.0.1:8000;
#         proxy_set_header Host              $http_host;
#         proxy_set_header X-Real-IP         $remote_addr;
#         proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#     }
# }
# ══════════════════════════════════════════════════════════════════

# ---------- 80：只做跳转 ----------
server {
    listen 80;
    server_name example.com www.example.com;

    # Let's Encrypt HTTP-01 续期校验必须能走明文 80，单独放行，不能跟着一起跳走。
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;   # 校验文件是纯文本，别让 MIME 猜错
    }

    # 其余一律 301 到 https。
    # 用 $host 是保留用户输入的主机名；若你还挂着裸 IP 或证书覆盖不到的临时域名
    # （那样会报「证书不匹配」），改成证书覆盖的那个固定主机名收敛掉，例如：
    #     return 301 https://example.com$request_uri;
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 443：真正的服务 ----------
server {
    listen 443 ssl;
    # `http2 on;` 需要 nginx >= 1.25.1（Ubuntu 24.04+ 自带满足）。老版本换成
    # 下面这行写法：listen 443 ssl http2;
    http2 on;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    # 这两个文件由 certbot 首次签发时自动生成，TLS 参数别手写。
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 地图底图上传上限 25MB（对应 settings.py 的 FILE_UPLOAD_MAX_MEMORY_SIZE），留点余量
    client_max_body_size 30m;

    # 静态资源压缩：nginx.conf 里的 gzip on 默认只压 text/html，
    # CSS/JS/JSON 必须显式列入 gzip_types，否则首屏几 MB 的脚本会原样跨境传输。
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;
    gzip_comp_level 5;

    # collectstatic 的产物，由 Nginx 直发（Gunicorn 不碰静态文件）
    location /static/ {
        alias /srv/opuscule/staticfiles/;
        access_log off;
        expires 7d;
    }

    # 用户上传文件（地图底图 / 语音 / 图片）走 location / → Gunicorn，由 Django 鉴权。
    # 切勿在这里加 alias 直发 /media/：那等于绕过鉴权，未公开的图能被直接下载。

    location / {
        proxy_pass http://127.0.0.1:8000;
        # 用 $http_host 而非 $host：$host 会丢掉端口。带端口访问时（如本地隧道
        # 127.0.0.1:8080），Django 拼出的同源是 http://127.0.0.1，与浏览器发来的
        # Origin 对不上 → CSRF 403。
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 让 Django 认出这是 HTTPS 请求（配合 settings.py 的 SECURE_PROXY_SSL_HEADER）
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
