# Nginx 反向代理（阿里云香港 / 免备案场景同样适用）。
# 部署到 /etc/nginx/conf.d/opuscule.conf 后：
#   sudo sed -i 's/example.com/你的域名/g' /etc/nginx/conf.d/opuscule.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 这里只配 HTTP。等 http://你的域名 能访问后，再跑一次（自动补 443 + 跳转）：
#   sudo certbot --nginx -d 你的域名 -d www.你的域名
# certbot 会自己插入 443 段、证书路径和 80→443 跳转，不需要手写证书。
#
# 注意顺序：DEBUG=0 时 Session/CSRF Cookie 带 Secure 标记，纯 HTTP 下登录会拿不到
# Cookie。所以「验证登录」要放在签发证书之后；签发前想自测，可临时 DJANGO_DEBUG=1。
#
# 分工：/static/ 由 Nginx 直发磁盘；/media/ 必须经 Django 鉴权（按「所属文档是否公开」
# 放行），所以**不能**用 alias 直发，否则知道路径就能下载未公开的图——让它落到下面
# location / 转发给 Gunicorn（见 world.views.media_file）。
# /sw.js 由 Django 提供（自带 Service-Worker-Allowed 头），无需特殊配置。

server {
    listen 80;
    server_name example.com www.example.com;

    # 地图底图上传上限 25MB（对应 settings.py 的 FILE_UPLOAD_MAX_MEMORY_SIZE），留点余量
    client_max_body_size 30m;

    # collectstatic 的产物，由 Nginx 直发（Gunicorn 不碰静态文件）
    location /static/ {
        alias /srv/opuscule/staticfiles/;
        access_log off;
        expires 7d;
    }

    # 用户上传文件（地图底图 / 语音 / 图片）走 location / → Gunicorn，由 Django 鉴权。
    # 切勿在这里加 alias 直发 /media/：那等于绕过鉴权，未公开的图能被直接下载。

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 让 Django 认出这是 HTTPS 请求（配合 settings.py 的 SECURE_PROXY_SSL_HEADER）
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
