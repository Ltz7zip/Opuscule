<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
  <style>
    @view-transition { navigation: auto; }
    /* Paint the canvas before the stylesheet arrives: a full-page click must
       not flash white between the old document and the new one. */
    html { background: #18181b; color-scheme: dark; }
    html[data-theme="light"] { background: #ffffff; color-scheme: light; }
    body { margin: 0; background: inherit; }
  </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18181b" />
    <script>
      /* Resolve the stored theme before first paint. SSR pages already carry
         data-theme from the cookie; this covers the SPA shell. */
      try {
        var storedTheme = localStorage.getItem("opuscule-theme");
        if (storedTheme === "light" || storedTheme === "dark") {
          document.documentElement.dataset.theme = storedTheme;
          document.cookie =
            "opuscule-theme=" + storedTheme + "; path=/; max-age=31536000; SameSite=Lax";
          if (storedTheme === "light") {
            document.querySelector('meta[name="theme-color"]')?.setAttribute("content", "#ffffff");
          }
        }
      } catch (error) {
        /* storage unavailable: keep the default theme */
      }
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2318181b'/%3E%3Ccircle cx='16' cy='16' r='6.5' fill='none' stroke='%23fafafa' stroke-width='1.5'/%3E%3Cpath d='M16 6.5v3M16 22.5v3M6.5 16h3M22.5 16h3' stroke='%23fafafa' stroke-width='1.2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Opuscule</title>
    <link rel="alternate" type="application/rss+xml" title="Opuscule 公开 Wiki" href="/feed.xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
