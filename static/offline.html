<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>离线 · 世界暂时打不开</title>
<!--
  Service Worker 的离线兜底页：断网且导航没命中网络时给这一张。
  刻意**自包含**（样式内联、不引任何外部文件）—— 离线时少一个请求就少一次失败。
-->
<style>
  :root { color-scheme: dark; --green: #3ddc97; --ink: #f4f2ee; --dim: #a9a49c; --line: rgba(255,255,255,.12); }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #121110; color: var(--dim);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background-image: radial-gradient(circle at 50% 0%, rgba(61,220,151,.06), transparent 60%);
  }
  .box { max-width: 460px; padding: 32px 28px; text-align: center; }
  .kicker { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); margin: 0 0 10px; }
  h1 { font-size: 44px; margin: 0 0 14px; color: var(--green); font-weight: 500; }
  p { margin: 0 0 10px; font-size: 13.5px; line-height: 1.75; }
  b { color: var(--ink); font-weight: 500; }
  a.btn {
    display: inline-block; margin-top: 14px; padding: 8px 16px; border-radius: 8px;
    border: 1px solid rgba(61,220,151,.45); color: var(--green); text-decoration: none; font-size: 13px;
  }
  a.btn:hover { background: rgba(61,220,151,.1); }
  .hint { margin-top: 16px; font-size: 11.5px; color: #6f6a63; }
</style>
</head>
<body>
  <main class="box">
    <p class="kicker">Offline · 离线</p>
    <h1>∅</h1>
    <p>网络断了，这一页没能从服务器拿到。</p>
    <p>你没写完的东西<b>还在本地存着</b>——网络恢复后会自动写回去。</p>
    <a class="btn" href="/" onclick="location.reload(); return false;">再试一次</a>
    <p class="hint">连着网之后刷新一下就行；待同步的改动会在联网时按顺序补写。</p>
  </main>
</body>
</html>
