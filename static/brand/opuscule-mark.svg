<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Opuscule">
  <!-- Opuscule 标记：圆（统一）里内接三角（火 / 转化），圆心是时间线节点。
       取「炼金术伟大之作的反义词」这层自谦：符号是炼金术的，尺寸是小的。 -->
  <rect width="32" height="32" rx="7" fill="#121110"/>
  <circle cx="16" cy="16" r="9.6" fill="none" stroke="#f4f2ee" stroke-width="1.4"/>
  <path d="M16 8.4 22.6 19.8H9.4Z" fill="none" stroke="#3ddc97" stroke-width="1.4"
        stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="16" cy="16" r="2.5" fill="#3ddc97"/>
</svg>
